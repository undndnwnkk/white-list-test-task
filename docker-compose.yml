services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    # Published on 5433 by default so it does not clash with a local PostgreSQL.
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DB_DSN: postgres://crm:crm@postgres:5432/crm?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # Not started by `docker compose up`; run with `docker compose run --rm --build tests`.
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DB_DSN: postgres://crm:crm@postgres:5432/crm_test?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
